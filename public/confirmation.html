<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka DarahTanyoe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom right, #fef2f2, #fecaca);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem;
            max-width: 28rem;
            width: 100%;
            text-align: center;
        }
        
        .icon-container {
            width: 5rem;
            height: 5rem;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .icon {
            width: 2.5rem;
            height: 2.5rem;
            color: white;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #4b5563;
            margin-bottom: 1.5rem;
        }
        
        .fallback {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 0.5rem;
            display: none;
        }
        
        .fallback.show {
            display: block;
        }
        
        .fallback-text {
            font-size: 0.875rem;
            color: #92400e;
            margin-bottom: 0.75rem;
        }
        
        .btn {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #dc2626;
        }
        
        .hint {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </div>
        <h1>Membuka DarahTanyoe</h1>
        <p class="subtitle">Aplikasi sedang dibuka...</p>
        
        <div id="fallback" class="fallback">
            <p class="fallback-text">Aplikasi tidak terbuka otomatis?</p>
            <button id="manual-link" class="btn">Buka Aplikasi</button>
            <p class="hint">Pastikan aplikasi DarahTanyoe sudah terinstall</p>
        </div>
    </div>

    <script>
        // Get confirmation ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const confirmationId = urlParams.get('id');
        
        if (confirmationId) {
            // Detect platform
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            
            // Deep link for manual/iOS usage
            const deepLink = `darahtanyoe://confirmation/${confirmationId}`;
            
            // Function to open app (same logic for auto and manual)
            function openApp() {
                if (isAndroid) {
                    // Android: Use Intent URL (more reliable)
                    const intentUrl = `intent://confirmation/${confirmationId}#Intent;scheme=darahtanyoe;package=com.darahtanyoe.app;S.browser_fallback_url=${window.location.origin}/confirmation.html?id=${confirmationId};end`;
                    window.location.href = intentUrl;
                } else {
                    // iOS/Other: Use deep link
                    window.location.href = deepLink;
                }
            }
            
            // Set manual button click handler
            document.getElementById('manual-link').addEventListener('click', function(e) {
                e.preventDefault();
                openApp();
            });
            
            // Auto redirect on page load
            openApp();
            
            // Show fallback after 2 seconds if app didn't open
            setTimeout(() => {
                document.getElementById('fallback').classList.add('show');
            }, 2000);
        } else {
            // No ID provided
            document.querySelector('.subtitle').textContent = 'Link tidak valid. ID konfirmasi tidak ditemukan.';
            document.querySelector('.icon-container').style.background = '#f59e0b';
        }
    </script>
</body>
</html>
